# main に変更が入るたびにサイトを組み立て、研究室のサーバーへ送る。
# サーバー情報は Settings > Secrets and variables > Actions に登録する(README 参照)。
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      SITE_BASE: ${{ vars.SITE_BASE || '/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://kit-sugahara-lab.net' }}
      # SSH(rsync) で送る場合
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      # FTP(FTPS) で送る場合
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      # 送り先ディレクトリ(例: /home/xxx/kit-sugahara-lab.net/public_html/new)
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check output
        run: npm run check:dist

      - name: Keep build result
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 7

      # --delete は使わない(サーバーにしかないファイルを消さないため)
      - name: Deploy via SSH (rsync)
        if: env.SSH_HOST != '' && env.DEPLOY_PATH != ''
        run: |
          # 値の前後の空白・改行を取り除く(貼り付け時に入りやすい)
          SSH_HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')
          SSH_PORT=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          SSH_USER=$(printf '%s' "$SSH_USER" | tr -d '[:space:]')
          DEPLOY_PATH=$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n' | sed 's/[[:space:]]*$//; s:/*$::')
          echo "接続先: $SSH_USER@$SSH_HOST (ポート $SSH_PORT)  送り先: $DEPLOY_PATH"

          mkdir -p ~/.ssh
          # Windows のメモ帳で貼ると入る改行コード(\r)を取り除く
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "--- 確認1: 秘密鍵の形式"
          head -1 ~/.ssh/deploy_key | grep -q -- '-----BEGIN' || { echo "::error::SSH_KEY の先頭が -----BEGIN で始まっていません。.key ファイルの中身を最初の行から全部貼り直してください。"; exit 1; }
          tail -1 ~/.ssh/deploy_key | grep -q -- '-----END' || { echo "::error::SSH_KEY の最後が -----END ... ----- で終わっていません。最後の行まで全部貼り直してください。"; exit 1; }
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null 2>/tmp/kerr; then
            if grep -qi 'passphrase\|incorrect' /tmp/kerr; then
              echo "::error::この秘密鍵にはパスフレーズが付いています。エックスサーバーで「パスフレーズなし」で鍵を作り直し、SSH_KEY を登録し直してください。"
            else
              echo "::error::SSH_KEY が秘密鍵として読めません($(cat /tmp/kerr))。.key ファイルの中身を全部貼り直してください。"
            fi
            exit 1
          fi
          echo "OK"

          echo "--- 確認2: サーバーにつながるか"
          if ! timeout 15 bash -c "echo > /dev/tcp/$SSH_HOST/$SSH_PORT" 2>/dev/null; then
            echo "::error::$SSH_HOST のポート $SSH_PORT につながりません。(1) エックスサーバーの SSH設定 が ON か (2) SSH設定の「国外IPアクセス制限」が OFF か (3) SSH_HOST(サーバーID.xsrv.jp)と SSH_PORT(10022)が正しいか を確認してください。"
            exit 1
          fi
          echo "OK"

          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"

          echo "--- 確認3: ログインできるか"
          if ! $SSH "$SSH_USER@$SSH_HOST" "echo login-ok" 2>/tmp/serr; then
            cat /tmp/serr
            if grep -qi 'permission denied' /tmp/serr; then
              echo "::error::鍵でログインできません。(1) SSH_USER がサーバーID になっているか (2) SSH_KEY がエックスサーバーで登録した鍵のものか を確認してください。"
            else
              echo "::error::SSH でログインできませんでした(上のメッセージを確認)。"
            fi
            exit 1
          fi

          echo "--- 確認4: 送り先フォルダ"
          parent=$(dirname "$DEPLOY_PATH")
          if ! $SSH "$SSH_USER@$SSH_HOST" "test -d '$parent'"; then
            echo "::error::$parent がサーバーにありません。DEPLOY_PATH のサーバーIDやドメイン名を確認してください。サーバー上のフォルダ一覧:"
            $SSH "$SSH_USER@$SSH_HOST" 'ls -1 ~' || true
            exit 1
          fi
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          echo "OK"

          echo "--- 配信"
          rsync -rlz --checksum --itemize-changes -e "$SSH" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          echo "完了: 配信しました"

      - name: Deploy via FTPS (lftp)
        if: env.SSH_HOST == '' && env.FTP_HOST != '' && env.DEPLOY_PATH != ''
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          lftp -c "set ftp:ssl-force true; set ssl:verify-certificate no; \
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\"; \
            mkdir -p -f \"$DEPLOY_PATH\"; \
            mirror -R --verbose --only-newer --no-perms dist/ \"$DEPLOY_PATH\""

      - name: No deploy target
        if: env.SSH_HOST == '' && env.FTP_HOST == ''
        run: echo "::notice::サーバー情報が未登録のため、ビルドのみ行いました(Actions の成果物 'site' から確認できます)。"
