# 本番サーバーに送る前に、見た目を確認するためのプレビュー。
# GitHub Pages(https://<ユーザー名>.github.io/sugahara-lab-web/)に公開される。
#  - main が更新されると自動で main の内容を表示
#  - AI の変更案ができると、その変更案の内容を表示
#  - Actions → Preview → Run workflow でブランチ名を指定すれば、任意の変更案を表示
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 表示したいブランチ名(変更案のブランチ。空なら main)
        required: false
        default: main

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Tokyo
      SITE_BASE: /${{ github.event.repository.name }}
      SITE_URL: https://${{ github.repository_owner }}.github.io
      PREVIEW_LABEL: ${{ inputs.branch || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run check:dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
