# 本番サーバーに送る前に、見た目を確認するためのプレビュー。
# GitHub Pages(https://<ユーザー名>.github.io/sugahara-lab-web/)に公開される。
#  - main が更新されると自動で main の内容を表示
#  - AI の変更案ができると、その変更案の内容を表示
#  - Actions → Preview → Run workflow でブランチ名を指定すれば、任意の変更案を表示
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 表示したいブランチ名(変更案のブランチ。空なら main)
        required: false
        default: main

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Tokyo
      SITE_BASE: /${{ github.event.repository.name }}
      SITE_URL: https://${{ github.repository_owner }}.github.io
      PREVIEW_LABEL: ${{ inputs.branch || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare font (Monapo)
        run: |
          sudo apt-get -qq update && apt-get download fonts-monapo
          dpkg-deb -x fonts-monapo_*.deb /tmp/monapo && rm fonts-monapo_*.deb
          pip install --quiet fonttools brotli
          find /tmp/monapo -name "*.ttf" | head -1 > /tmp/monapo-path
          cat /tmp/monapo-path
      - run: npm install --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            # 失敗の理由を画面上部(Annotations)に出す
            grep -iE "error|invalid|failed|expected|does not match" build.log | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Font subset
        run: |
          export MONAPO_LICENSE=$(find /tmp/monapo -iname "copyright" | head -1)
          python3 scripts/subset-font.py "$(cat /tmp/monapo-path)" dist
      - run: npm run check:dist
      # 組み立て結果を preview-build ブランチにも置く(画面を見られない環境から中身を確認するため)
      - name: Push to preview-build branch
        run: |
          cp -r dist /tmp/site && cd /tmp/site
          git init -q -b preview-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "preview ${{ inputs.branch || 'main' }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" preview-build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
