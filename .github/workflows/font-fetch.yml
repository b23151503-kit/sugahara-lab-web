# IPAモナーフォントを取得して font-src ブランチに置く(フォント導入作業用・手動実行)
name: Fetch IPA Mona font

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA Mona fonts
        run: |
          mkdir -p out && cd out
          F=opfc-ModuleHP-1.1.1_withIPAMonaFonts-1.0.8.tar.gz
          curl -fsSL "http://distcache.FreeBSD.org/local-distfiles/hrs/$F" -o "$F"
          echo "ab77beea3b051abf606cd8cd3badf6cb24141ef145c60f508fcfef1e3852bb9d  $F" | sha256sum -c -
          tar xzf "$F" && rm "$F"
          find . -iname "*.ttf" -o -iname "*.otf" -o -iname "*.ttc" | tee fonts.txt
          find . -iname "*license*" -o -iname "*readme*" | tee docs.txt
      - name: Save to font-src branch
        run: |
          cd out
          git init -q -b font-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "font probe"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" font-src
