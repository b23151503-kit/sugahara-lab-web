# inbox/ にメモや写真、BibTeX などを置いて push すると、
# Claude が CLAUDE.md のルールに沿って記事・業績・メンバー情報に整え、プルリクエストを作る。
# 内容を確認してマージすれば、Build & Deploy が動いてサイトに反映される。
name: Inbox → AI editing

on:
  push:
    branches: [main]
    paths:
      - 'inbox/**'
      - '!inbox/README.md'
  workflow_dispatch:

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Anything to do?
        id: check
        run: |
          n=$(find inbox -type f ! -name README.md ! -name .gitkeep | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.check.outputs.count != '0'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            このリポジトリは菅原研究室のホームページです。まず CLAUDE.md を読んでください。
            inbox/ に置かれたファイル(README.md と .gitkeep 以外)を読み、CLAUDE.md の「inbox の処理」に従って
            src/content/ 以下にお知らせ・業績・メンバーのファイルを作成または更新してください。
            画像は public/uploads/YYYY/ に移し、記事から参照してください。
            処理し終えた inbox のファイルは削除してください(README.md と .gitkeep は残す)。
            git の commit や push はしないでください(後の手順で行います)。
            最後に、何を作成・変更したかを日本語で inbox-report.md に箇条書きで書いてください。
          claude_args: |
            --max-turns 40
            --allowedTools Read,Write,Edit,Glob,Grep,Bash(mkdir:*),Bash(mv:*),Bash(rm:*),Bash(ls:*),Bash(cat:*)

      - name: Report
        id: report
        if: steps.check.outputs.count != '0'
        run: |
          if [ -f inbox-report.md ]; then
            { echo 'body<<EOF'; cat inbox-report.md; echo 'EOF'; } >> "$GITHUB_OUTPUT"
            rm inbox-report.md
          else
            echo "body=inbox の内容を反映しました。" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.check.outputs.count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: inbox/${{ github.run_id }}
          commit-message: "inbox: AIが記事・業績を作成"
          title: "inbox の内容をサイトに反映(AI作成・要確認)"
          body: |
            ${{ steps.report.outputs.body }}

            ---
            内容を確認して問題なければマージしてください。マージするとサイトに反映されます。
          labels: inbox
